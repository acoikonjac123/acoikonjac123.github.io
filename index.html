<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoikonjac's GitHub Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f6f8fa;
            color: #24292f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            background: #fff;
            border-bottom: 1px solid #d0d7de;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #0969da;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 18px;
        }

        .navbar span {
            font-weight: 600; font-size: 16px; color: #24292f;
        }

        .navbar .nav-right {
            margin-left: auto;
            display: flex; align-items: center; gap: 16px;
        }

        .lang-switch {
            display: flex; align-items: center; gap: 4px;
        }

        .lang-switch button {
            font-size: 13px; color: #57606a;
            padding: 4px 10px; border-radius: 4px;
            border: none; background: transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .lang-switch button:hover { color: #0969da; background: #f6f8fa; }
        .lang-switch button.active { color: #fff; background: #0969da; font-weight: 600; }

        .container {
            width: 100%; max-width: 900px; padding: 0 24px; margin-top: 60px;
        }

        .hero { text-align: center; margin-bottom: 50px; }

        .avatar-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #d0d7de;
            display: block;
            margin: 0 auto 20px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(9, 105, 218, 0.2);
        }

        .hero h1 { font-size: 36px; color: #24292f; margin-bottom: 8px; }
        .hero .username {
            font-size: 20px; color: #0969da; font-weight: 400; margin-bottom: 16px;
        }
        .hero .bio {
            font-size: 16px; color: #57606a; max-width: 520px;
            margin: 0 auto 24px; line-height: 1.6;
        }

        .stats {
            display: flex; justify-content: center; gap: 32px;
            margin-bottom: 50px; flex-wrap: wrap;
        }

        .stat-item { text-align: center; }
        .stat-item .number { font-size: 28px; font-weight: 700; color: #24292f; }
        .stat-item .label { font-size: 13px; color: #57606a; margin-top: 4px; }

        .section { margin-bottom: 40px; }

        .section-title {
            font-size: 20px; font-weight: 600; color: #24292f;
            margin-bottom: 16px; padding-bottom: 8px;
            border-bottom: 1px solid #d0d7de;
            display: flex; align-items: center; gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px; height: 20px;
            background: #0969da; border-radius: 2px;
        }

        .repo-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .repo-card {
            background: #fff; border: 1px solid #d0d7de;
            border-radius: 10px; padding: 20px;
            transition: all 0.2s ease;
            cursor: pointer; text-decoration: none; color: inherit;
        }

        .repo-card:hover {
            border-color: #0969da; transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(9, 105, 218, 0.1);
        }

        .repo-card h3 { font-size: 16px; color: #0969da; margin-bottom: 8px; }
        .repo-card p { font-size: 13px; color: #57606a; line-height: 1.5; margin-bottom: 12px; }
        .repo-meta { display: flex; gap: 16px; font-size: 12px; color: #57606a; flex-wrap: wrap; }
        .repo-meta span { display: flex; align-items: center; gap: 4px; }

        .skills { display: flex; flex-wrap: wrap; gap: 10px; }

        .skill-tag {
            background: #f6f8fa; border: 1px solid #d0d7de;
            border-radius: 20px; padding: 6px 16px;
            font-size: 13px; color: #0969da;
            transition: all 0.2s ease;
        }

        .skill-tag:hover { background: #ddf4ff; border-color: #0969da; }

        .social-links {
            display: flex; justify-content: center; gap: 20px;
            margin-top: 16px; flex-wrap: wrap;
        }

        .social-link {
            display: flex; align-items: center; gap: 6px;
            color: #57606a; text-decoration: none; font-size: 14px;
            transition: color 0.2s;
        }

        .social-link:hover { color: #0969da; }

        footer {
            margin-top: 60px; padding: 32px 24px;
            text-align: center; border-top: 1px solid #d0d7de;
            width: 100%; color: #8c959f; font-size: 13px;
        }

        footer a { color: #0969da; text-decoration: none; }

        @media (max-width: 600px) {
            .repo-list { grid-template-columns: 1fr; }
            .hero h1 { font-size: 28px; }
            .stats { gap: 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <img class="logo" src="./yc.png" alt="Avatar">
        <span>acoikonjac123</span>
        <div class="nav-right">
            <div class="lang-switch">
                <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
                <button id="btn-en" onclick="setLang('en')">English</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <img class="avatar-img" src="./yc.png" alt="Avatar">
            <h1>acoikonjac123</h1>
            <p class="username">@acoikonjac123</p>
            <p class="bio" data-i18n="bio"></p>
            <div class="social-links">
                <a class="social-link" href="https://github.com/acoikonjac123" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.73.083-.73 1.205.085 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.604-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </a>
                <a class="social-link" href="/cf-fetch/" target="_blank">
                    🔧 CF Fetcher
                </a>
            </div>
        </section>

        <div class="stats">
            <div class="stat-item"><div class="number" id="stat-repos">...</div><div class="label" data-i18n="statRepos"></div></div>
            <div class="stat-item"><div class="number" id="stat-followers">...</div><div class="label" data-i18n="statFollowers"></div></div>
            <div class="stat-item"><div class="number" id="stat-following">...</div><div class="label" data-i18n="statFollowing"></div></div>
        </div>

        <section class="section">
            <h2 class="section-title" data-i18n="sectionProjects"></h2>
            <div class="repo-list">
                <a class="repo-card" href="/cf-fetch/" target="_blank">
                    <h3>CF Fetcher</h3>
                    <p data-i18n="cfDesc"></p>
                    <div class="repo-meta">
                        <span data-i18n="cfMeta1"></span>
                        <span data-i18n="cfMeta2"></span>
                    </div>
                </a>
                <a class="repo-card" href="https://github.com/YgreenMC/more-golden-foods" target="_blank">
                    <h3>More Golden Foods</h3>
                    <p data-i18n="mgfDesc"></p>
                    <div class="repo-meta">
                        <span data-i18n="mgfMeta1"></span>
                        <span class="mod-downloads" id="mod-downloads"></span>
                    </div>
                </a>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title" data-i18n="sectionSkills"></h2>
            <div class="skills">
                <span class="skill-tag">C++</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">Java</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Chrome Extension</span>
            </div>
        </section>
    </div>

    <footer>
        <p><span data-i18n="footerBuilt"></span> <a href="https://github.com/acoikonjac123" target="_blank">acoikonjac123</a> &copy; 2026</p>
    </footer>

    <script>
        // ---------- 国际化文案 ----------
        var i18n = {
            zh: {
                bio: '热爱开源，专注竞赛编程工具与 Web 开发。<br>让每一次 AC 都留下痕迹。',
                statRepos: '仓库',
                statFollowers: '关注者',
                statFollowing: '正在关注',
                sectionProjects: '精选项目',
                cfDesc: '抓取 Codeforces AC 提交记录，一键生成格式化 README.md。完全本地运行，API 密钥不上传。',
                cfMeta1: '🧩 Chrome 扩展',
                cfMeta2: '🌐 在线使用',
                mgfDesc: '为 Minecraft 加入 8 种金质食物，每种给予生命恢复 II。支持 Fabric 加载器。',
                mgfMeta1: '☕ Java',
                sectionSkills: '技术栈',
                footerBuilt: 'Built with ❤️ by'
            },
            en: {
                bio: 'Open source enthusiast. Focused on competitive programming tools and web development.<br>Making every AC submission count.',
                statRepos: 'Repositories',
                statFollowers: 'Followers',
                statFollowing: 'Following',
                sectionProjects: 'Featured Projects',
                cfDesc: 'Fetch your Codeforces accepted submissions and generate a clean README.md. Runs entirely in your browser — API keys never leave your device.',
                cfMeta1: '🧩 Chrome Extension',
                cfMeta2: '🌐 Online',
                mgfDesc: 'Adds 8 golden foods to Minecraft, each granting Regeneration II. Fabric mod.',
                mgfMeta1: '☕ Java',
                sectionSkills: 'Tech Stack',
                footerBuilt: 'Built with ❤️ by'
            }
        };

        var currentLang = 'zh';
        var modDownloads = null;

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            var elems = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < elems.length; i++) {
                var key = elems[i].getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key] !== undefined) {
                    elems[i].innerHTML = i18n[lang][key];
                }
            }

            try { localStorage.setItem('preferred-lang', lang); } catch (e) {}
            renderDownloads();
        }

        function renderDownloads() {
            var el = document.getElementById('mod-downloads');
            if (!el) return;
            if (modDownloads === null) {
                el.textContent = '⬇ ...';
                return;
            }
            var num = modDownloads.toLocaleString();
            el.textContent = currentLang === 'zh'
                ? '⬇ ' + num + ' 次下载'
                : '⬇ ' + num + ' downloads';
        }

        // 恢复语言偏好
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('preferred-lang'); } catch (e) {}
            if (saved === 'en' || saved === 'zh') {
                setLang(saved);
            } else {
                setLang('zh');
            }
        })();

        // ---------- GitHub 用户统计 ----------
        fetch('https://api.github.com/users/acoikonjac123')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                document.getElementById('stat-repos').textContent = data.public_repos != null ? data.public_repos : '-';
                document.getElementById('stat-followers').textContent = data.followers != null ? data.followers : '-';
                document.getElementById('stat-following').textContent = data.following != null ? data.following : '-';
            })
            .catch(function () {
                document.getElementById('stat-repos').textContent = '-';
                document.getElementById('stat-followers').textContent = '-';
                document.getElementById('stat-following').textContent = '-';
            });

        // ---------- Modrinth 下载量 ----------
        fetch('https://api.modrinth.com/v2/project/more-golden-foods')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                modDownloads = data.downloads || 0;
                renderDownloads();
            })
            .catch(function () {
                modDownloads = 0;
                renderDownloads();
            });
    </script>

</body>
</html>
